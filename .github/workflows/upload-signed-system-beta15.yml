name: One-time transfer of locally signed system Beta 15
on:
  push:
    branches: [main]
    paths: [.github/workflows/upload-signed-system-beta15.yml]
permissions:
  contents: write
concurrency:
  group: signed-system-beta15-upload
  cancel-in-progress: false
jobs:
  upload:
    if: github.repository == 't4kas/GaiaOS-Releases' && contains(github.event.head_commit.message, '[upload-system-beta15]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install public bundle inspection and transport utilities
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends rauc xdelta3
      - name: Reconstruct pinned signed bytes, verify, upload and verify public assets
        run: python3 .upload/v0.4.8-beta.15/upload.py
