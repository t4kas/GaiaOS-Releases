name: One-time upload of locally signed artwork Beta
on:
  push:
    branches: [main]
    paths: [.github/workflows/upload-signed-artwork.yml]
permissions:
  contents: write
concurrency:
  group: signed-artwork-beta7-upload
  cancel-in-progress: false
jobs:
  upload:
    if: github.repository == 't4kas/GaiaOS-Releases' && contains(github.event.head_commit.message, '[upload-artwork-beta7]')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      GITHUB_TOKEN: ${{ github.token }}
      SIGNED_BUNDLE_URL: "https://sdmntprpolandcentral.oaiusercontent.com/files/00000000-8a10-820a-9188-21192de0c8ad/raw?se=2026-11-02T16%3A51%3A18Z&sp=r&sv=2026-02-06&sr=b&scid=6c7ffb16-8a61-4ee3-91b2-7c148fde0731&skoid=e5f84a89-964a-4fd3-92c2-c2cb3a12ea16&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-02T05%3A47%3A56Z&ske=2026-11-03T05%3A47%3A56Z&sks=b&skv=2026-02-06&sig=0/vJnHmp%2Bo4vKn43/%2Bsrcbr3hx3pZHR9ldL0eXpEWdI%3D"
    steps:
      - name: Verify existing signatures, upload and verify public release assets
        run: |
          python3 - <<'PY'
          import base64
          import hashlib
          import io
          import json
          import os
          from pathlib import Path
          import subprocess
          import tarfile
          import tempfile
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          import zipfile
          
          REPO="t4kas/GaiaOS-Releases"
          API="https://api.github.com/repos/"+REPO
          VERSION="0.4.8-beta.7"
          TAG="v"+VERSION
          SOURCE="b6d605d51b8c0a3c75ae11ac317cd1e1097f3c41"
          ZIP_SHA="7bb8b3d1e779cd8a9c132f3b3c45d95fa3471aa33fb6d5e9a56967a17d8c03ea"
          PUBLIC_KEY="-----BEGIN PUBLIC KEY-----\nMCowBQYDK2VwAyEAlCHh1NiZSlLcGGWy+XNvSvyTA28/mGYDnPj4a7o+wzk=\n-----END PUBLIC KEY-----\n"
          EXPECTED={
           "gaia-launcher-0.4.8-beta.7-x86_64.tar.zst":(8257644,"6b1f4bc1c47024c5a434b9feb1d84c575a5812bb4cfd9c5b037f870855dec550"),
           "gaia-launcher-0.4.8-beta.7-x86_64.tar.zst.sig":(64,"1c227a009999dc1d90814929c54dc04238e923160bd1a721f1554cdd3058b2c2"),
           "SHA256SUMS":(220,"c1d7d1459c50b0cdb6dade5f1e6bbb311e303a0517af40593cfce06b70e19754"),
           "SHA256SUMS.sig":(64,"5f7039d291a0722bdf23d696db5960007cfc6a481a897f08821be5d21ebf4a82")
          }
          
          
          def request(url, data=None, method="GET", raw=False):
              headers={"Authorization":"Bearer "+os.environ["GITHUB_TOKEN"],"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28","User-Agent":"GaiaOS-One-Time-Signed-Upload"}
              if data is not None:
                  headers["Content-Type"]="application/octet-stream" if raw else "application/json"
                  if not raw:data=json.dumps(data).encode()
              with urllib.request.urlopen(urllib.request.Request(url,data=data,method=method,headers=headers),timeout=60) as response:
                  return json.load(response)
          
          
          def absent(url):
              try:request(url)
              except urllib.error.HTTPError as error:
                  if error.code==404:return
                  raise
              raise RuntimeError("The release/tag already exists; refusing to reuse its version.")
          
          
          def public_digest(url):
              digest=hashlib.sha256()
              size=0
              with urllib.request.urlopen(url,timeout=45) as response:
                  while chunk:=response.read(1024*1024):
                      digest.update(chunk)
                      size+=len(chunk)
              return size,digest.hexdigest()
          
          
          def main():
              assert os.environ["GITHUB_REPOSITORY"]==REPO
              absent(API+"/releases/tags/"+TAG)
              absent(API+"/git/ref/tags/"+TAG)
              feed=request(API+"/contents/channels/beta.json")
              current=json.loads(base64.b64decode(feed["content"]))
              assert current["release"]["version"]=="0.4.8-beta.6","Beta changed; inspect before publishing"
              with urllib.request.urlopen(os.environ["SIGNED_BUNDLE_URL"],timeout=45) as response:
                  blob=response.read(9*1024*1024)
              assert hashlib.sha256(blob).hexdigest()==ZIP_SHA,"Signed transport ZIP digest mismatch"
              with tempfile.TemporaryDirectory(prefix="gaia-public-upload-") as temporary:
                  folder=Path(temporary)
                  with zipfile.ZipFile(io.BytesIO(blob)) as archive:
                      assert set(archive.namelist())==set(EXPECTED)|{"release-notes.md","verification.json"}
                      for name,(size,digest) in EXPECTED.items():
                          content=archive.read(name)
                          assert len(content)==size and hashlib.sha256(content).hexdigest()==digest,name
                          (folder/name).write_bytes(content)
                      notes=archive.read("release-notes.md").decode()
                  key=folder/"public.pem"
                  key.write_text(PUBLIC_KEY)
                  package=folder/("gaia-launcher-"+VERSION+"-x86_64.tar.zst")
                  for file in (package,folder/"SHA256SUMS"):
                      subprocess.run(["openssl","pkeyutl","-verify","-pubin","-inkey",str(key),"-rawin","-in",str(file),"-sigfile",str(file)+".sig"],check=True)
                  sums={line.split("  ")[1]:line.split("  ")[0] for line in (folder/"SHA256SUMS").read_text().splitlines()}
                  assert sums=={name:digest for name,(_,digest) in EXPECTED.items() if name not in ("SHA256SUMS","SHA256SUMS.sig")}
                  unpacked=subprocess.check_output(["zstd","-d","-q","-c",str(package)])
                  with tarfile.open(fileobj=io.BytesIO(unpacked)) as archive:
                      meta=json.load(archive.extractfile("gaia-update.json"))
                  assert (meta["version"],meta["source_commit"],meta["component"],meta["platform"],meta["architecture"])==(VERSION,SOURCE,"launcher","linux-debian-13","x86_64")
                  created=request(API+"/releases",{"tag_name":TAG,"target_commitish":os.environ["GITHUB_SHA"],"name":"GaiaOS "+VERSION,"body":notes,"prerelease":True,"draft":True,"make_latest":"false"},"POST")
                  prefix=created["upload_url"].split("{")[0]
                  assets=[]
                  for name,(size,digest) in EXPECTED.items():
                      asset=request(prefix+"?name="+urllib.parse.quote(name),(folder/name).read_bytes(),"POST",raw=True)
                      assert asset["size"]==size and asset["digest"]=="sha256:"+digest,"Uploaded digest mismatch"
                      assets.append({"id":asset["id"],"name":name,"size":size,"sha256":digest})
                  published=request(API+"/releases/"+str(created["id"]),{"draft":False,"make_latest":"false"},"PATCH")
                  download="https://github.com/"+REPO+"/releases/download/"+TAG+"/"
                  for name,expected in EXPECTED.items():
                      for attempt in range(6):
                          try:
                              assert public_digest(download+urllib.parse.quote(name))==expected,"Anonymous download differs"
                              break
                          except (urllib.error.HTTPError,urllib.error.URLError):
                              if attempt==5:raise
                              time.sleep(5)
                  print("RELEASE_VERIFIED "+json.dumps({"version":VERSION,"source_commit":SOURCE,"release_id":created["id"],"url":published["html_url"],"published_at":published["published_at"],"public_verified":True,"assets":assets}),flush=True)
                  print("Beta feed has not been changed by this upload job.",flush=True)
          
          
          if __name__=="__main__":
              try:main()
              except Exception as error:
                  print("Upload stopped: "+type(error).__name__,flush=True)
                  raise
          
          PY
