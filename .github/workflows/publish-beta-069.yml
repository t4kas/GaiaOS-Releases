name: Publish pinned GaiaOS Beta 9 (temporary)
on: workflow_dispatch
permissions:
  contents: write
concurrency:
  group: gaia-beta-069-publisher
  cancel-in-progress: false
jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify signed bundle and upload existing draft
        shell: bash
        run: |
          python3 - <<'PY'
          """One pinned, upload-only publication. Never builds, signs, or advances a feed."""
          import base64
          import hashlib
          import io
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys
          import tarfile
          import tempfile
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          import zipfile

          REPOSITORY='t4kas/GaiaOS-Releases'
          API='https://api.github.com/repos/'+REPOSITORY
          RELEASE_ID=432054874
          VERSION='0.4.8-beta.9'
          SOURCE='707c37cc033dde9a79adbc4e6f073bd5dff3beb0'
          TRANSPORT_SHA256='06c0b2036782bf5df9ea066e1874f6628717e04178c1cb155749ebea87280fe3'
          BLOB_SHA='a7fe284067029a8ceef055d48f71d85dd69a609a'
          PUBLIC_KEY=base64.b64decode('LS0tLS1CRUdJTiBQVUJMSUMgS0VZLS0tLS0KTUNvd0JRWURLMlZ3QXlFQWxDSGgxTmlaU2xMY0dHV3krWE52U3Z5VEEyOC9tR1lEblBqNGE3byt3ems9Ci0tLS0tRU5EIFBVQkxJQyBLRVktLS0tLQo=')
          ASSETS={'gaia-launcher-0.4.8-beta.9-x86_64.tar.zst': {'bytes': 8487633, 'sha256': '71efaf74064ac87d33e41003d85bb36283084845e721bde7f2defb9c373be1ef'}, 'gaia-launcher-0.4.8-beta.9-x86_64.tar.zst.sig': {'bytes': 64, 'sha256': '79b4136f366550f4fa69c3451d9c8c7db4444e167a479f478d7fb784166155fb'}, 'SHA256SUMS': {'bytes': 220, 'sha256': '906eed4d4826fc1e7bff1eba305ab5c3432066e7fd84ab41554424bb5f8792fb'}, 'SHA256SUMS.sig': {'bytes': 64, 'sha256': 'aeccef264b8ce1e5dff1d9935a83bdbdaf1c78ffa935e615773643d067bf6c9e'}}

          class Redirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,newurl):
                  if not newurl.startswith('https://'):raise ValueError('Insecure redirect')
                  result=super().redirect_request(req,fp,code,msg,headers,newurl)
                  if urllib.parse.urlsplit(req.full_url).netloc!=urllib.parse.urlsplit(newurl).netloc:
                      result.remove_header('Authorization')
                  return result

          OPENER=urllib.request.build_opener(Redirect())
          def request(url,method='GET',data=None,auth=True,binary=False):
              headers={'User-Agent':'GaiaOS-One-Time-Publisher-069','Accept':'application/vnd.github+json'}
              if auth:headers['Authorization']='Bearer '+os.environ['GH_TOKEN']
              if data is not None:
                  if binary:headers['Content-Type']='application/octet-stream'
                  else:headers['Content-Type']='application/json';data=json.dumps(data).encode()
              with OPENER.open(urllib.request.Request(url,data=data,method=method,headers=headers),timeout=45) as response:
                  content=response.read()
              return content if binary else json.loads(content) if content else None

          def sha(content):return hashlib.sha256(content).hexdigest()

          def verify_transport(content,folder):
              assert sha(content)==TRANSPORT_SHA256,'Transport digest mismatch'
              assert hashlib.sha1(b'blob '+str(len(content)).encode()+b'\0'+content).hexdigest()==BLOB_SHA
              with zipfile.ZipFile(io.BytesIO(content)) as archive:
                  assert set(archive.namelist())==set(ASSETS)|{'release-notes.md'}
                  for name in archive.namelist():
                      assert '/' not in name and '\\' not in name
                      (folder/name).write_bytes(archive.read(name))
              for name,expected in ASSETS.items():
                  data=(folder/name).read_bytes()
                  assert (len(data),sha(data))==(expected['bytes'],expected['sha256']),name
              public=folder/'trust-public.pem';public.write_bytes(PUBLIC_KEY)
              package=folder/('gaia-launcher-'+VERSION+'-x86_64.tar.zst')
              for path in [package,folder/'SHA256SUMS']:
                  subprocess.run(['openssl','pkeyutl','-verify','-pubin','-inkey',str(public),'-rawin','-in',str(path),'-sigfile',str(path)+'.sig'],check=True)
              sums={line.split('  ',1)[1]:line.split('  ',1)[0] for line in (folder/'SHA256SUMS').read_text().splitlines()}
              assert sums=={name:ASSETS[name]['sha256'] for name in [package.name,package.name+'.sig']}
              with tempfile.TemporaryFile() as raw:
                  subprocess.run(['zstd','-q','-d','-c',str(package)],stdout=raw,check=True);raw.seek(0)
                  with tarfile.open(fileobj=raw) as archive:
                      metadata=json.load(archive.extractfile('gaia-update.json'))
              assert metadata['version']==VERSION and metadata['source_commit']==SOURCE
              assert metadata['component']=='launcher' and metadata['platform']=='linux-debian-13' and metadata['architecture']=='x86_64'
              assert metadata['requires_reboot'] is False
              notes=(folder/'release-notes.md').read_text();assert SOURCE in notes
              return notes

          def main():
              local=len(sys.argv)==3 and sys.argv[1]=='--validate-only'
              if local:content=Path(sys.argv[2]).read_bytes()
              else:
                  blob=request(API+'/git/blobs/'+BLOB_SHA)
                  assert blob['sha']==BLOB_SHA and blob['encoding']=='base64'
                  content=base64.b64decode(blob['content'])
              with tempfile.TemporaryDirectory(prefix='gaia-upload-069-') as temporary:
                  folder=Path(temporary);notes=verify_transport(content,folder)
                  if local:print('PINNED_BETA_069_VALIDATION_PASS');return
                  # No published tag may be reused, including after a completed job retry.
                  try:request(API+'/git/ref/tags/v'+VERSION)
                  except urllib.error.HTTPError as error:
                      if error.code!=404:raise
                  else:raise ValueError('Release tag already exists')
                  release=request(API+'/releases/'+str(RELEASE_ID))
                  assert release['id']==RELEASE_ID and release['tag_name']=='v'+VERSION and release['draft'] and release['prerelease']
                  assert release['body']==notes,'Draft notes/provenance mismatch'
                  existing={asset['name']:asset for asset in release['assets']}
                  assert set(existing)<=set(ASSETS),'Unexpected draft assets'
                  for name,expected in ASSETS.items():
                      asset=existing.get(name)
                      if asset is None:
                          url=release['upload_url'].split('{')[0]+'?name='+urllib.parse.quote(name)
                          asset=request(url,method='POST',data=(folder/name).read_bytes(),binary=True)
                          asset=json.loads(asset)
                      assert asset['size']==expected['bytes'] and asset.get('digest')=='sha256:'+expected['sha256'],name
                  request(API+'/releases/'+str(RELEASE_ID),method='PATCH',data={'draft':False})
                  prefix='https://github.com/'+REPOSITORY+'/releases/download/v'+VERSION+'/'
                  for name,expected in ASSETS.items():
                      for attempt in range(6):
                          try:
                              downloaded=request(prefix+name,auth=False,binary=True)
                              assert len(downloaded)==expected['bytes'] and sha(downloaded)==expected['sha256'],name
                              break
                          except (urllib.error.URLError,AssertionError):
                              if attempt==5:raise
                              time.sleep(5)
                  print('BETA_069_PUBLISHED_AND_ANONYMOUS_DOWNLOADS_VERIFIED; channel feed unchanged')

          if __name__=='__main__':main()
          PY
