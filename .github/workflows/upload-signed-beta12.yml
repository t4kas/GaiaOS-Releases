name: One-time upload of locally signed Beta 0.4.8-beta.12
# One-time upload of an already locally signed and verified package (RELEASE-077).
# Include the explicitly tracked signed archive despite the normal build-output ignore.
on:
  push:
    branches: [main]
    paths: [.github/workflows/upload-signed-beta12.yml]
permissions:
  contents: write
concurrency:
  group: signed-beta12-upload
  cancel-in-progress: false
jobs:
  upload:
    if: github.repository == 't4kas/GaiaOS-Releases' && contains(github.event.head_commit.message, '[upload-beta12]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify local signatures, upload and verify public assets
        run: |
          python3 - <<'PY'
          import hashlib, json, os, subprocess, time, urllib.error, urllib.request
          from pathlib import Path
          REPO="t4kas/GaiaOS-Releases"; API="https://api.github.com/repos/"+REPO
          VERSION="0.4.8-beta.12"; TAG="v"+VERSION; SOURCE="eda96b378d351c5f1537829c30fa77aad62f7b6a"
          PUBLIC_KEY="-----BEGIN PUBLIC KEY-----\nMCowBQYDK2VwAyEAlCHh1NiZSlLcGGWy+XNvSvyTA28/mGYDnPj4a7o+wzk=\n-----END PUBLIC KEY-----\n"
          D=Path(".upload")/TAG
          PKG="gaia-launcher-"+VERSION+"-x86_64.tar.zst"
          EXPECTED={'gaia-launcher-0.4.8-beta.12-x86_64.tar.zst': 'd9557b981f5833e0f52faca72f971394c96233470480d256fb2b677df1178a41', 'gaia-launcher-0.4.8-beta.12-x86_64.tar.zst.sig': 'b9126c83321faf689e2d3d2cc9789f1b759d5e81c0f5c49cb3bc290735238aa1', 'SHA256SUMS': '8172ba56f3a91a503378a9c011a335a52817703b420781edde6d3945522038ec', 'SHA256SUMS.sig': '3a3b42d600f98c8ad57a04d317709b54d52e31c9a409ea0c52f69c1050cc3d9b'}
          def sha(p): return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          for name,digest in EXPECTED.items():
              assert sha(D/name)==digest, name
          Path("pub.pem").write_text(PUBLIC_KEY)
          for name in (PKG,"SHA256SUMS"):
              subprocess.run(["openssl","pkeyutl","-verify","-pubin","-inkey","pub.pem","-rawin","-in",str(D/name),"-sigfile",str(D/(name+".sig"))],check=True)
          for line in (D/"SHA256SUMS").read_text().split("\n"):
              if line.strip():
                  digest,name=line.split("  ");assert EXPECTED[name]==digest,name
          meta=json.loads(subprocess.check_output(["tar","--zstd","-xOf",str(D/PKG),"gaia-update.json"]))
          assert (meta["version"],meta["source_commit"],meta["component"]) == (VERSION,SOURCE,"launcher")
          H={"Authorization":"Bearer "+os.environ["GITHUB_TOKEN"],"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28","User-Agent":"GaiaOS-One-Time-Signed-Upload"}
          def req(url,data=None,method="GET",ctype="application/json"):
              h=dict(H)
              if data is not None: h["Content-Type"]=ctype
              with urllib.request.urlopen(urllib.request.Request(url,data=data,method=method,headers=h),timeout=120) as r: return json.load(r)
          # Resume only this task's reviewed empty draft after local upload HTTP 401.
          rel=req(API+"/releases/438577173")
          assert rel["id"]==438577173 and rel["tag_name"]==TAG and rel["draft"] and rel["prerelease"] and not rel["assets"]
          assert rel["body"]==(D/"release-notes.md").read_text()
          files=[PKG,PKG+".sig","SHA256SUMS","SHA256SUMS.sig"]
          for name in files:
              req("https://uploads.github.com/repos/"+REPO+"/releases/"+str(rel["id"])+"/assets?name="+name,(D/name).read_bytes(),"POST","application/octet-stream")
          req(API+"/releases/"+str(rel["id"]),json.dumps(dict(draft=False)).encode(),"PATCH")
          for name in files:
              url="https://github.com/"+REPO+"/releases/download/"+TAG+"/"+name
              for attempt in range(10):
                  try:
                      with urllib.request.urlopen(url,timeout=120) as r: body=r.read(); break
                  except urllib.error.HTTPError: time.sleep(3)
              else: raise SystemExit("Anonymous download failed: "+name)
              assert hashlib.sha256(body).hexdigest()==sha(D/name), name
              print("verified", name, len(body))
          PY
