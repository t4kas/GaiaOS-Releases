name: One-time transfer of locally signed system Beta 13
on:
  push:
    branches: [main]
    paths: [.github/workflows/upload-signed-system-beta13.yml]
permissions:
  contents: write
concurrency:
  group: signed-system-beta13-upload
  cancel-in-progress: false
jobs:
  upload:
    if: github.repository == 't4kas/GaiaOS-Releases' && contains(github.event.head_commit.message, '[upload-system-beta13]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Install public bundle inspection utility
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends rauc
      - name: Verify pinned chunks and signatures, upload and verify public assets
        run: python3 .upload/v0.4.8-beta.13/upload.py
