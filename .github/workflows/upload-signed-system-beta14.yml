name: One-time transfer of locally signed corrected system Beta 14
on:
  push:
    branches: [main]
    paths: [.github/workflows/upload-signed-system-beta14.yml]
permissions:
  contents: write
concurrency:
  group: signed-system-beta14-upload
  cancel-in-progress: false
jobs:
  upload:
    if: github.repository == 't4kas/GaiaOS-Releases' && contains(github.event.head_commit.message, '[upload-system-beta14]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Install public bundle inspection and transport utilities
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends rauc xdelta3
      - name: Reconstruct pinned signed bytes, verify, upload and verify public assets
        run: python3 .upload/v0.4.8-beta.14/upload.py
