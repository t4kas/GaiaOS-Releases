name: Temporary signed Beta 17 upload
on: workflow_dispatch
permissions:
  contents: write
jobs:
  upload:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify pinned signed bytes, upload exact draft and verify public downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 release-087-transfer/upload.py
